<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KERBERUS — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:     #D0021B;
      --bg:      #0A0A0A;
      --surface: #111111;
      --border:  #222222;
      --text:    #FFFFFF;
      --muted:   #888888;
      --input-bg:#181818;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Barlow', sans-serif;
      overflow: hidden;
    }

    #particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .glow {
      position: fixed;
      width: 700px; height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(208,2,27,0.16) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: translate(-50%,-50%) scale(1); }
      50%       { opacity: 1;   transform: translate(-50%,-50%) scale(1.1); }
    }

    .scanline {
      position: fixed;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(208,2,27,0.6), transparent);
      z-index: 0;
      pointer-events: none;
      animation: scan 6s linear infinite;
    }

    @keyframes scan {
      0%   { top: -2px; opacity: 0; }
      5%   { opacity: 1; }
      95%  { opacity: 1; }
      100% { top: 100vh; opacity: 0; }
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(17,17,17,0.93);
      border: 1px solid var(--border);
      border-top: 2px solid var(--red);
      border-radius: 4px;
      padding: 48px 44px 40px;
      width: 100%;
      max-width: 420px;
      backdrop-filter: blur(16px);
      box-shadow: 0 0 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(208,2,27,0.08);
      animation: cardIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(28px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card > * {
      animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .card > *:nth-child(1) { animation-delay: 0.10s; }
    .card > *:nth-child(2) { animation-delay: 0.18s; }
    .card > *:nth-child(3) { animation-delay: 0.24s; }
    .card > *:nth-child(4) { animation-delay: 0.30s; }
    .card > *:nth-child(5) { animation-delay: 0.36s; }
    .card > *:nth-child(6) { animation-delay: 0.42s; }
    .card > *:nth-child(7) { animation-delay: 0.48s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo { text-align: center; margin-bottom: 32px; }

    .logo-text {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 2.4rem;
      letter-spacing: 0.06em;
      color: var(--text);
      line-height: 1;
    }

    .logo-text em { font-style: normal; color: var(--red); }

    .logo-sub {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      color: var(--red);
      text-transform: uppercase;
      margin-top: 4px;
    }

    .divider {
      width: 32px; height: 2px;
      background: var(--red);
      margin: 20px auto 28px;
      animation: expandLine 0.6s 0.3s cubic-bezier(0.22,1,0.36,1) both;
    }

    @keyframes expandLine {
      from { width: 0; opacity: 0; }
      to   { width: 32px; opacity: 1; }
    }

    .card-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 1.7rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 4px;
    }

    .card-sub { font-size: 0.82rem; color: var(--muted); margin-bottom: 28px; }

    .form-group { margin-bottom: 18px; }

    .form-label {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      font-size: 0.92rem;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input::placeholder { color: #444; }

    .form-input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 2px rgba(208,2,27,0.14);
    }

    .btn {
      position: relative;
      overflow: hidden;
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      background: var(--red);
      border: none;
      border-radius: 3px;
      color: #fff;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
      transform: skewX(-20deg);
      transition: left 0.5s;
    }

    .btn:hover::after { left: 160%; }
    .btn:hover  { background: #b50017; }
    .btn:active { transform: scale(0.98); }

    .auth-footer { text-align: center; margin-top: 22px; font-size: 0.82rem; color: var(--muted); }
    .auth-footer a { color: var(--red); text-decoration: none; font-weight: 500; }
    .auth-footer a:hover { text-decoration: underline; }

    .toast {
      position: fixed;
      bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--red);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 3px;
      font-size: 0.85rem;
      z-index: 99;
      opacity: 0;
      transition: transform 0.3s, opacity 0.3s;
      white-space: nowrap;
    }

    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <canvas id="particles"></canvas>
  <div class="glow"></div>
  <div class="scanline"></div>

  <div class="card">
    <div class="logo">
      <div class="logo-text">KER<em>BE</em>RUS</div>
      <div class="logo-sub">Formula 1 Intelligence</div>
    </div>
    <div class="divider"></div>

    <div class="card-title">Acesso</div>
    <div class="card-sub">Entre com suas credenciais para continuar</div>

    <div class="form-group">
      <label class="form-label">E-mail</label>
      <input type="email" class="form-input" placeholder="seu@email.com" id="email" />
    </div>

    <div class="form-group">
      <label class="form-label">Senha</label>
      <input type="password" class="form-input" placeholder="••••••••" id="senha" />
    </div>

    <button class="btn" onclick="handleLogin()">Entrar</button>

    <div class="auth-footer">
      Não tem conta? <a href="cadastro.html">Criar conta</a>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* ── Partículas ── */
    const canvas = document.getElementById('particles');
    const ctx    = canvas.getContext('2d');
    let W, H, particles = [];

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    function rand(a, b) { return a + Math.random() * (b - a); }

    function createParticle() {
      return {
        x: rand(0, W), y: rand(0, H),
        vx: rand(-0.3, 0.3), vy: rand(-0.6, -0.15),
        size: rand(1, 2.5),
        alpha: rand(0.2, 0.7),
        color: Math.random() < 0.25 ? '#D0021B' : '#ffffff'
      };
    }

    for (let i = 0; i < 80; i++) particles.push(createParticle());

    function drawParticles() {
      ctx.clearRect(0, 0, W, H);

      ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 1;
      for (let y = 0; y < H; y += 120) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }

      ctx.strokeStyle = '#161616'; ctx.lineWidth = 1.5;
      [[-100,900,300,0],[50,900,450,0],[200,900,600,0],
       [1540,900,1140,0],[1390,900,990,0],[1240,900,840,0]]
      .forEach(([x1,y1,x2,y2]) => {
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      });

      particles.forEach(p => {
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle   = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        p.x += p.vx; p.y += p.vy; p.alpha -= 0.001;
        if (p.y < -10 || p.alpha <= 0) Object.assign(p, createParticle(), { y: H + 5 });
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(drawParticles);
    }
    drawParticles();

    /* ── Toast ── */
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    /* ── Login ── */
    function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;

      if (!email || !senha) { showToast('Preencha todos os campos.'); return; }

      fetch('/api/users/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, senha })
      })
      .then(r => { if (!r.ok) throw new Error('Email ou senha incorretos'); return r.json(); })
      .then(data => {
        localStorage.setItem('token', data.token);
        localStorage.setItem('usuario', JSON.stringify(data.usuario));
        showToast('Login realizado!');
        setTimeout(() => window.location.href = 'dashboard.html', 1000);
      })
      .catch(err => showToast('Erro: ' + err.message));
    }
  </script>
</body>
</html>
